<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px/1.3 ui-monospace,monospace}canvas{display:block}#result{display:none}</style>
</head><body>
<canvas id="c"></canvas><pre id="result"></pre>
<script type="module">
// probe.html?asset=<id>&state=<s>&h=<hour>&t=<sec>&p=<0..1>&seed=<n>&bg=sky|grey|black
//   mode=grid: one row per state (or states=a,b), one column per hour (hours=8,12,18.5,22) or per seed (seeds=0,1,2)
//   ref=<repo path>: puts the reference image beside the render, for the three matching passes
import { byId, drawAsset } from '../src/assets/registry.js';
import { lightAt } from '../src/core/light.js';
import { css, vgrad } from '../src/core/paint.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const a = byId.get(q.get('asset'));
const out = { asset: q.get('asset'), ok: !!a, errors: [] };
addEventListener('error', (e) => out.errors.push(String(e.message)));
const W = innerWidth, H = innerHeight;
const cv = document.getElementById('c'); cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
cv.style.width = W + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);

function background(x, y, w, h, L) {
  const bg = q.get('bg') || 'sky';
  if (bg === 'grey') ctx.fillStyle = '#6b6e73';
  else if (bg === 'black') ctx.fillStyle = '#000';
  else ctx.fillStyle = vgrad(ctx, y, y + h, [[0, L.sky.top], [0.78, L.sky.horizon], [0.78, L.haze], [1, L.ambient]]);
  ctx.fillRect(x, y, w, h);
}

function cell(x, y, w, h, o, label) {
  const L = lightAt(o.h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  background(x, y, w, h, L);
  const s = Math.min((w * 0.8) / a.w, (h * 0.8) / a.h);
  ctx.translate(x + w / 2, y + h * 0.9); ctx.scale(s, s);
  const t0 = performance.now();
  drawAsset(ctx, a, { t: o.t, p: o.p, state: o.state, seed: o.seed, L, lit: L.side, scale: s, ...o.extra });
  out.ms = Math.max(out.ms || 0, performance.now() - t0);
  ctx.restore();
  if (label) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, y, w, 18); ctx.fillStyle = '#ddd'; ctx.fillText(label, x + 6, y + 13); }
}

async function main() {
  if (!a) { document.title = 'done'; return; }
  const extra = q.has('extra') ? JSON.parse(q.get('extra')) : {};
  const base = { t: num('t', 2), p: num('p', 0.5), seed: num('seed', 0), h: num('h', 17.8), state: q.get('state') || a.states[0], extra };
  let refImg = null;
  if (q.get('ref') || (q.get('mode') === 'ref' && a.ref)) {
    refImg = new Image(); refImg.src = '../' + (q.get('ref') || a.ref);
    await refImg.decode().catch(() => { out.errors.push('ref did not load'); refImg = null; });
  }
  const area = refImg ? { w: W / 2 } : { w: W };
  if (q.get('mode') === 'grid') {
    const rows = q.has('states') ? q.get('states').split(',') : a.states;
    const cols = q.has('seeds') ? q.get('seeds').split(',').map((s) => ({ seed: +s })) :
      (q.get('hours') || '8,12,18.5,22').split(',').map((h) => ({ h: +h }));
    const cw = area.w / cols.length, rh = H / rows.length;
    rows.forEach((st, j) => cols.forEach((c, i) => {
      const o = { ...base, state: st, ...c };
      const tag = `${st} ${'seed' in c ? 'seed ' + c.seed : o.h + 'h'}${a.once && a.once[st] ? ' p' + o.p : ''}`;
      cell(i * cw, j * rh, cw, rh, o, tag);
    }));
  } else {
    cell(0, 0, area.w, H, base, `${a.id} ${base.state} ${base.h}h t${base.t}`);
  }
  if (refImg) {
    const s = Math.min((W / 2) / refImg.width, H / refImg.height);
    ctx.fillStyle = '#000'; ctx.fillRect(W / 2, 0, W / 2, H);
    ctx.drawImage(refImg, W / 2 + (W / 2 - refImg.width * s) / 2, (H - refImg.height * s) / 2, refImg.width * s, refImg.height * s);
  }
  document.getElementById('result').textContent = JSON.stringify(out);
  document.title = 'done';
}
main().catch((e) => { out.errors.push(String(e)); document.getElementById('result').textContent = JSON.stringify(out); });
</script>
</body></html>
