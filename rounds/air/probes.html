<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Paired air probes</title>
<style>
  body { margin: 0; background: #111; height: min(100dvh, 900px); display: grid; grid-template-rows: 1fr 1fr; }
  iframe { display: block; border: 0; width: 100%; height: 100%; min-height: 0; }
</style>
<script type="module">
  const q = new URLSearchParams(location.search);
  const pairs = {
    jets: [['jet-siso', 'p=0.34'], ['jet-enemy', 'p=0.34']],
    rotors: [['helicopter', ''], ['drone', '']],
  };
  for (const [id, extra] of pairs[q.get('pair')]) {
    const probe = document.createElement('iframe');
    probe.title = id;
    probe.src = '../../tools/probe.html?asset=air.' + id + '&mode=grid&t=1.33&' + extra;
    document.body.append(probe);
  }
</script>
</html>
