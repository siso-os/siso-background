<!doctype html>
<html><head><meta charset="utf-8"><title>strip</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px/1.3 ui-monospace,monospace}canvas{display:block}#result{display:none}</style>
</head><body>
<canvas id="c"></canvas><pre id="result"></pre>
<script type="module">
// strip.html?asset=<id>&state=<s>&ps=0.05,0.2,...  (or ts=0,1,2) &hours=12,22 &seed=0 &scale=1 &extra={}
// One row per hour, one column per p (or t). scale=0.3 draws it at that pixel scale, as the scene would.
import { byId, drawAsset } from '../../src/assets/registry.js';
import { lightAt } from '../../src/core/light.js';
import { vgrad } from '../../src/core/paint.js';
const q = new URLSearchParams(location.search);
const a = byId.get(q.get('asset'));
const out = { errors: [], ms: 0 };
addEventListener('error', (e) => out.errors.push(String(e.message)));
const W = innerWidth, H = innerHeight;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const hours = (q.get('hours') || '12,22').split(',').map(Number);
const isT = q.has('ts');
const cols = (q.get(isT ? 'ts' : 'ps') || '0.02,0.08,0.18,0.35,0.6,0.85').split(',').map(Number);
const extra = q.has('extra') ? JSON.parse(q.get('extra')) : {};
const states = q.has('states') ? q.get('states').split(',') : [q.get('state') || (a && a.states[0])];
const rows = [];
for (const st of states) for (const h of hours) rows.push({ st, h });
const cw = W / cols.length, rh = H / rows.length;
rows.forEach((r, j) => cols.forEach((v, i) => {
  const L = lightAt(r.h);
  const x = i * cw, y = j * rh;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, cw, rh); ctx.clip();
  ctx.fillStyle = q.get('bg') === 'black' ? '#000' : vgrad(ctx, y, y + rh, [[0, L.sky.top], [0.8, L.sky.horizon], [0.8, L.haze], [1, L.ambient]]);
  ctx.fillRect(x, y, cw, rh);
  const sc = q.has('scale') ? Number(q.get('scale')) : Math.min((cw * 0.8) / a.w, (rh * 0.8) / a.h);
  ctx.translate(x + cw / 2, y + rh * (q.has('base') ? Number(q.get('base')) : 0.9)); ctx.scale(sc, sc);
  const t0 = performance.now();
  drawAsset(ctx, a, { t: isT ? v : Number(q.get('t') || 2), p: isT ? Number(q.get('p') || 0.5) : v, state: r.st, seed: Number(q.get('seed') || 0), L, lit: L.side, scale: sc, ...extra });
  out.ms = Math.max(out.ms, performance.now() - t0);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, y, cw, 16); ctx.fillStyle = '#ddd';
  ctx.fillText(`${r.st} ${r.h}h ${isT ? 't' : 'p'}${v}`, x + 5, y + 12);
}));
document.getElementById('result').textContent = JSON.stringify(out);
document.title = 'done';
</script></body></html>
